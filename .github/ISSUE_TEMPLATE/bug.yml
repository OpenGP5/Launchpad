name: Bug
description: Something in Launchpad doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If the pedal doesn't start after a flash, try [recovery](https://opengp5.github.io/docs/get-started/recovery/) first. A problem with a firmware itself (its sound, screen or controls) belongs in that firmware's repository.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: "1. Open Tones\n2. Drop a .nam file\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launchpad version, and what the pedal runs
      placeholder: "Launchpad 0.3.0, NAM Loader 1.3.1 (Home shows what the pedal runs)"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [Home, Flash, Tones, Presets, Live, Backups, Mods, Developer, Settings, Installing or starting Launchpad, Connecting to the pedal]
  - type: input
    id: system
    attributes:
      label: Your computer's system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04 ...
  - type: textarea
    id: log
    attributes:
      label: Output, log or screenshots
      description: "Screenshots help most. Launchpad's **Developer** page has the pedal's log (**Save the log**), or a photo of the screen."
      render: text
